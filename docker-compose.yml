services:
  db:
    image: postgres:16-alpine
    container_name: sales_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_pass
      POSTGRES_DB: sales_db
    ports:
      - "5432:5432"
    volumes:
      - sales_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sales_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sales_user:sales_pass@db:5432/sales_db
      SECRET_KEY: change-me-in-production-please
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"

  admin-dashboard:
    build:
      context: ./admin-dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: sales_admin_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  salesman-app:
    build:
      context: ./salesman-app
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: sales_salesman_app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  sales_db_data:
